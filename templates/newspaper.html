<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视野日报 - {{DATE}}</title>
    <link rel="stylesheet" href="../static/css/newspaper.css">
</head>
<body>
    <div class="newspaper">
        <!-- 报头 -->
        <header class="masthead">
            {{STUDIO_BRAND}}
            <div class="ornament-top"></div>
            <h1 class="newspaper-title">视野日报</h1>
            <div class="subtitle">THE VISION DAILY</div>
            <div class="header-info">
                <span class="date">{{DATE}}</span>
                <span class="divider">|</span>
                <span class="issue">第 {{ISSUE_NUMBER}} 期</span>
            </div>
            <div class="ornament-bottom"></div>
        </header>

        <!-- 头版重点新闻 -->
        <section class="headline-section">
            {{TOP_STORY}}
        </section>

        <!-- 分栏内容 -->
        <main class="content-columns">
            {{SECTIONS}}
        </main>

        <!-- 版尾 - 历史上的今天 -->
        <footer class="newspaper-footer">
            <div class="ornament-divider"></div>
            <section class="history-on-this-day" aria-labelledby="history-heading">
                <h3 id="history-heading">📅 历史上的今天</h3>
                <p class="history-intro">回望同月同日：关爱与福利、科技医疗教育、正义与人权、自由平等博爱，以及文化艺术与文明。</p>
                {{HISTORY_EVENTS}}
            </section>
            <div class="footer-note">
                <p>视野日报 · 由 AI 自动生成 · 每日更新</p>
            </div>
        </footer>
    </div>
</body>
</html>
