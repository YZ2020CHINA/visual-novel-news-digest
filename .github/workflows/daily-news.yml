name: 视野日报每日生成

permissions:
  contents: write

env:
  TZ: Asia/Shanghai  # 提交信息中的 date 命令也使用北京时间

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

on:
  schedule:
    - cron: '27 17 * * *'  # 北京时间次日 01:27
    - cron: '37 19 * * *'  # 北京时间次日 03:37
    - cron: '12 20 * * *'  # 北京时间次日 04:12
    - cron: '37 21 * * *'  # 北京时间次日 05:37
    - cron: '42 22 * * *'  # 北京时间 06:42
    - cron: '12 23 * * *'  # 北京时间 07:12，早间兜底
    - cron: '42 23 * * *'  # 北京时间 07:42，早间兜底
    - cron: '12 0 * * *'   # 北京时间 08:12，逾时补发
    - cron: '42 0 * * *'   # 北京时间 08:42，逾时补发
    - cron: '12 1 * * *'   # 北京时间 09:12
    - cron: '12 3 * * *'   # 北京时间 11:12
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-newspaper:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 排队期间上一期可能已提交；启动时读取分支最新版本及去重记录。
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 检查今天是否已出刊
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "digests/$(date +%F).html" ]; then
            echo "今天的日报已生成，跳过生成，继续检查邮件预约"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          if [ "${{ steps.guard.outputs.skip }}" = "true" ]; then
            pip install requests beautifulsoup4
          else
            pip install -r requirements.txt
          fi

      - name: 测试照片效果、排版、新闻来源和最新一期入口
        if: steps.guard.outputs.skip != 'true'
        run: python -m unittest test_newsprint test_latest_digest test_layout test_news_sources test_platform_news test_news_history test_newsletter test_on_this_day -v

      - name: 生成视野日报
        if: steps.guard.outputs.skip != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python news_digest.py

      - name: 提交生成的报纸
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add digests/*.html digests/*.news.json
          if git diff --staged --quiet; then
            echo "没有新文件需要提交"
          else
            git commit -m "📰 $(date +'%Y-%m-%d') 视野日报"
            git push
          fi

      - name: 预约 08:00 邮件推送或当天补发
        if: github.ref_name == github.event.repository.default_branch
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python newsletter.py schedule
