name: 视野日报每日生成

permissions:
  contents: write

env:
  TZ: Asia/Shanghai  # 提交信息中的 date 命令也使用北京时间

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

on:
  schedule:
    - cron: '12 20 * * *'  # 每天 UTC 20:12（次日北京时间 04:12）
  workflow_dispatch:  # 允许手动触发

jobs:
  generate-newspaper:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 排队期间上一期可能已提交；启动时读取分支最新版本及去重记录。
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 测试照片效果、排版、新闻来源和最新一期入口
        run: python -m unittest test_newsprint test_latest_digest test_layout test_news_sources test_platform_news test_news_history -v

      - name: 生成视野日报
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          python news_digest.py

      - name: 提交生成的报纸
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add digests/*.html digests/*.news.json
          if git diff --staged --quiet; then
            echo "没有新文件需要提交"
          else
            git commit -m "📰 $(date +'%Y-%m-%d') 视野日报"
            git push
          fi
